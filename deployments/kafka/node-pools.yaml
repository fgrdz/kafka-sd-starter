apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controllers
  namespace: kafka
  labels: {strimzi.io/cluster: experiment}
spec:
  replicas: 3
  roles: [controller]
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {cpu: 500m, memory: 768Mi}
  storage:
    type: persistent-claim
    size: 1Gi
    deleteClaim: false
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: brokers
  namespace: kafka
  labels: {strimzi.io/cluster: experiment}
spec:
  replicas: 3
  roles: [broker]
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
  storage:
    type: persistent-claim
    size: 2Gi
    deleteClaim: false

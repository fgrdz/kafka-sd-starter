apiVersion: v1
kind: ServiceAccount
metadata:
  name: experiment-fault-runner
  namespace: kafka
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: experiment-fault-runner
  namespace: kafka
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: experiment-fault-runner
  namespace: kafka
subjects:
  - kind: ServiceAccount
    name: experiment-fault-runner
    namespace: kafka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: experiment-fault-runner

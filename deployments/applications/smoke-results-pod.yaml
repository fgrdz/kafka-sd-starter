apiVersion: v1
kind: Pod
metadata:
  name: ${RESULTS_POD_NAME}
  namespace: kafka
  labels:
    app.kubernetes.io/name: smoke-results-copy
    experiment/run-id: ${RUN_ID}
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
  containers:
    - name: results
      # The runner image is Alpine-based, so kubectl cp can rely on tar.
      image: kafka-sd-starter-runner:dev
      imagePullPolicy: Never
      command: [sh, -c, "trap 'exit 0' TERM INT; sleep 3600 & wait"]
      resources:
        requests: {cpu: 5m, memory: 16Mi}
        limits: {cpu: 50m, memory: 64Mi}
      volumeMounts:
        - {name: results, mountPath: /results, readOnly: true}
  volumes:
    - name: results
      persistentVolumeClaim:
        claimName: ${PVC_NAME}

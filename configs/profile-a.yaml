profile: A
brokers:
  - experiment-kafka-bootstrap.kafka.svc:9092
topic: experiment-profile-a
consumer_group: experiment-consumer
partitions: 3
replication_factor: 1
min_insync_replicas: 1
producer:
  rate_per_second: 100
  acks: leader
  idempotent: false
  retries: 3
message:
  payload_bytes: 1024
metrics:
  producer_address: ":8080"
  consumer_address: ":8081"
experiment:
  warmup: 2m
  baseline: 5m
  timeout: 15m
  application_stable: 10s
  performance_window: 60s
